name: Deploy to Cloudflare Pages

# 纯静态部署：pnpm generate 产出静态文件（.output/public），用 wrangler pages deploy 推送到 Cloudflare Pages。
# 若目标 Pages 项目尚不存在，工作流会自动创建（project create），因此无需在 CF 面板预建项目。
on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'LICENSE*'
      - 'LICENCE-CC-BY-NC-SA'
      - '.gitattributes'
      - '.editorconfig'
  # 手动触发：仓库 → Actions → 选本工作流 → Run workflow
  workflow_dispatch:

# 同一时间只允许一个部署在跑，避免并发部署互相覆盖
concurrency:
  group: deploy-cloudflare-pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Pages 项目名，可用仓库级 Variable（CF_PAGES_PROJECT_NAME）覆盖，未设置时用默认名
  CF_PAGES_PROJECT_NAME: ${{ vars.CF_PAGES_PROJECT_NAME || 'maochenyu-blog' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # 与 package.json 的 packageManager 字段保持一致（pnpm@12.5.1）
          version: 12.5.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 与 package.json engines 匹配
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm generate

      - name: Verify build output
        run: |
          if [ ! -d .output/public ]; then
            echo "::error::Build output directory .output/public not found"
            exit 1
          fi
          du -sh .output/public

      # 目标 Pages 项目不存在时自动创建；若已存在会报错，这里忽略即可（continue-on-error）
      - name: Create Cloudflare Pages project (if missing)
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ env.CF_PAGES_PROJECT_NAME }} --production-branch=main

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .output/public --project-name=${{ env.CF_PAGES_PROJECT_NAME }} --branch=${{ github.ref_name }} --commit-dirty=true