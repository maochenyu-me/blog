		<rect x="712" y="192" width="120" height="160" fill="#C2BCB2"/>
		<rect x="252" y="512" width="160" height="172" fill="#E23A2E"/>
		<rect x="612" y="512" width="160" height="172" fill="#E23A2E"/>
		<rect x="192" y="784" width="640" height="48" fill="#E23A2E"/>
	</g>
</svg>
